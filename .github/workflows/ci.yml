name: CI

# The app build/test pipeline. Skips landing-only changes — those have their
# own pages.yml deploy and don't touch the Rust/Swift app.
on:
  push:
    branches: [main]
    paths-ignore: ['landing/**']
  pull_request:
    paths-ignore: ['landing/**']

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # The knowledge checks resolve engine SHAs and count commit ranges, which
      # a depth-1 submodule cannot answer. Without this they return "cannot ask"
      # and pass silently, which is how a stale delta count reached main three
      # advances running.
      - name: Unshallow the engine submodule
        run: |
          set -euo pipefail
          if [ "$(git -C vendor/tokscale-core rev-parse --is-shallow-repository)" = "false" ]; then
            echo "engine already complete"
          else
            git -C vendor/tokscale-core fetch --unshallow --quiet
          fi
          test "$(git -C vendor/tokscale-core rev-parse --is-shallow-repository)" = "false"

      - name: Validate knowledge contracts
        run: |
          python3 scripts/check_knowledge.py --self-test
          python3 scripts/check_knowledge.py

      # Guards the misfire that reached the tag three times: notes are bound to
      # the tag by filename, so a release cannot inherit the previous version's
      # text. Build-independent, so it runs before the toolchain.
      - name: Release notes contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A tag with no notes file must fail, not fall back.
          if GITHUB_REF_NAME=v0.0.0-absent scripts/release_notes.sh >/dev/null 2>&1; then
            echo "::error::release_notes.sh accepted a tag with no notes file"
            exit 1
          fi

          # Every committed pair must agree on its figures. The plain-text notes
          # reach the Sparkle dialog and the markdown reaches the release page;
          # a reader comparing the two should not find different numbers.
          shopt -s nullglob
          for f in release-notes/*.txt; do
            python3 scripts/check_release_notes.py "$(basename "$f" .txt)"
          done

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Rust staticlib
        run: cargo build --release

      - name: Build Swift package
        run: swift build

      - name: Core logic selftest
        # Pace copy and Format's date output are localized, and several
        # assertions compare against the English text. Pin the language so the
        # result never depends on the runner's locale.
        run: swift run TokenBar --selftest -AppleLanguages "(en)"

      - name: FFI smoke test
        run: swift run TokenBar --smoke

      # Every step above compiles the debug configuration, so nothing here can
      # see a `#if DEBUG` boundary break. The release configuration was first
      # compiled by scripts/bundle.sh, which only runs from release.yml on a
      # `v*` tag — so a call to a DEBUG-only symbol stayed green through local
      # gates, PR CI and merge, and failed only after the tag was already
      # pushed. PR #137 hit exactly that.
      #
      # Push-only, not on pull_request: this class of break needs someone to
      # touch a conditional-compilation boundary, which is rare, and a release
      # build is slow enough that paying for it on every PR iteration is a bad
      # trade. Running it on main still guarantees the tag is never the first
      # time this configuration is compiled.
      - name: Build Swift package (release configuration)
        if: github.event_name == 'push'
        run: swift build -c release

      # Every step above runs the bare executable, where
      # `Bundle.main.bundleIdentifier` is nil. A value keyed on that is literal
      # where the suite looks and something else where it ships — #146 wrote
      # three source scans against exactly that and all three were escaped,
      # because the gap is not in the source text. Running the suite from the
      # bundled binary is what observes it.
      #
      # Same push-only trade as the step above, and it reuses that release
      # build, so the marginal cost here is the bundling and one suite run.
      #
      # `SELFTEST_BUNDLE_ID=` — empty, on purpose. The Makefile defaults to a
      # throwaway identifier so a local run cannot write into the installed
      # app's preference domain, and empty here means "whatever
      # scripts/bundle.sh defaults to", which is the shipping identifier.
      #
      # That difference is the gate. A value keyed on the identifier merely
      # being non-nil is caught either way, but one keyed on the production
      # string takes the safe branch under any other identity — so the run that
      # blocks a release has to carry the real one. This runner is ephemeral and
      # has no TokenBar installed, which is what makes that safe here and not on
      # a developer's Mac.
      #
      # Empty rather than the literal: a second copy of the identifier is a
      # second place for a rename to silently weaken this into a no-op.
      - name: Selftest from the bundled release binary
        if: github.event_name == 'push'
        run: make selftest-bundled SELFTEST_BUNDLE_ID=
